name: condo_market_local
description: "Marketplace acadêmico local para Android e web."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Ícones usados por componentes adaptativos do Flutter no navegador.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  image_picker: any
  uuid: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_condo.png
    - assets/banners/
