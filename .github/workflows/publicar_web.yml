name: Publicar aplicativo web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
      - name: Instalar dependências
        run: flutter pub get
      - name: Verificar projeto
        run: |
          flutter analyze
          flutter test
      - name: Compilar site
        run: flutter build web --release --base-href /condo-market-local/ --no-web-resources-cdn --no-wasm-dry-run
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Publicar no GitHub Pages
        uses: actions/deploy-pages@v4
